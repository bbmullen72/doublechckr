<!doctype html>
<!-- A "DRAFT" stamp, screenshotted to a see-through PNG. The watermarked
     contract uses it as a picture, so the word DRAFT is NOT in the PDF's text.
     Only something that looks at the page (Gemini's vision) can see it. -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: transparent; }
    body { display: grid; place-items: center; width: 1400px; height: 500px; }
    .stamp {
      padding: 10px 60px;
      border: 18px solid #c62828;
      border-radius: 28px;
      color: #c62828;
      font: 900 260px/1 "Arial Black", Arial, sans-serif;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body><div class="stamp">DRAFT</div></body>
</html>
