<!doctype html>
<!-- Sponsor packet page 2 (picture only): photos from last year. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="packet-image-page.css">
  <style>
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .photo { height: 300px; border-radius: 12px; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box; color: #fff; font-weight: 700; font-size: 18px; }
    .a { background: linear-gradient(135deg, #7a0f1d, #c2453f); }
    .b { background: linear-gradient(135deg, #f2b524, #d0782a); }
    .c { background: linear-gradient(135deg, #2b5876, #4e4376); }
    .d { background: linear-gradient(135deg, #1d6b55, #6bb38a); }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>GullHacks 2025 in Pictures</h1>
    <p class="sub">180 hackers · 36 hours · 42 projects</p>
    <div class="grid">
      <div class="photo a">Opening ceremony</div>
      <div class="photo b">Midnight snack line</div>
      <div class="photo c">Hardware track demos</div>
      <div class="photo d">Award winners with Sammy</div>
    </div>
  </div>
</body>
</html>
