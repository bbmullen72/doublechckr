<!doctype html>
<!-- Sponsor packet page 4 (picture only): prize podium. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="packet-image-page.css">
  <style>
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 16px; height: 520px; }
    .step { width: 190px; border-radius: 10px 10px 0 0; color: #fff; text-align: center; padding-top: 20px; box-sizing: border-box; font-weight: 700; }
    .step b { display: block; font-size: 54px; }
    .first { height: 420px; background: #f2b524; color: #4a3200; }
    .second { height: 320px; background: #9aa3ad; }
    .third { height: 240px; background: #b0723d; }
    .tracks { margin-top: 30px; font-size: 18px; text-align: center; color: #5d6470; }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>Prizes</h1>
    <p class="sub">Overall winners, plus a prize for every track</p>
    <div class="podium">
      <div class="step second"><b>2nd</b>Mechanical keyboards</div>
      <div class="step first"><b>1st</b>Tablets for the team</div>
      <div class="step third"><b>3rd</b>Noise-canceling headphones</div>
    </div>
    <p class="tracks">Tracks: AI · Cybersecurity · Hardware · Best Beginner Hack</p>
  </div>
</body>
</html>
