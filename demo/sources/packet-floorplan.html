<!doctype html>
<!-- Sponsor packet page 3 (picture only): venue floor plan. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="packet-image-page.css">
  <style>
    .plan { position: relative; height: 640px; border: 4px solid #1f2328; border-radius: 6px; background: #faf7f0; }
    .room { position: absolute; display: grid; place-items: center; border: 3px solid #1f2328; font-weight: 700; text-align: center; font-size: 16px; }
    .hack { left: 20px; top: 20px; width: 420px; height: 360px; background: #fde9b8; }
    .stage { left: 460px; top: 20px; width: 170px; height: 220px; background: #f3d3d6; }
    .food { left: 460px; top: 260px; width: 170px; height: 120px; background: #d9eadf; }
    .sponsor { left: 20px; top: 400px; width: 610px; height: 100px; background: #e6dcf3; }
    .entry { left: 250px; top: 520px; width: 140px; height: 90px; background: #fff; }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>Venue Floor Plan</h1>
    <p class="sub">Where sponsors set up</p>
    <div class="plan">
      <div class="room hack">Hacking floor<br>(60 tables)</div>
      <div class="room stage">Main stage</div>
      <div class="room food">Food</div>
      <div class="room sponsor">Sponsor row: 8 recruiting tables</div>
      <div class="room entry">Entrance</div>
    </div>
  </div>
</body>
</html>
